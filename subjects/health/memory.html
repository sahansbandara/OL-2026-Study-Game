    <h1>🧠 මතක උපක්‍රම — කාඩ්පත් 39</h1>
    <p>කාඩ්පතක ඉදිරිපස කෙටි ක්‍රමය බලලා, පිටුපස මොකද කියලා ඔයාම මතක් කරන්න. ඊට පස්සේ පෙරළලා බලන්න. හැම කාඩ්පතකටම +2 XP!</p>
    <div class="callout tip"><span class="ic">💡</span><div><p><b>Active recall:</b> කියවනවට වඩා “මතකයෙන් ගන්න” උත්සාහ කරන එකයි මොළයට හොඳම. දවසට දෙපාරක් මේ කාඩ්පත් ටික බලන්න.</p></div></div>

  <div class="deck"><button class="flip" data-id="hea-m0"><span class="in"><span class="f"><strong>🌟 පූර්ණ සෞඛ්‍යය</strong><small>කා–මා–ස–ආ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කායික · මානසික · සමාජීය · ආධ්‍යාත්මික. රෝග නැති බව පමණක් නොවේ.</span></span></span></button><button class="flip" data-id="hea-m1"><span class="in"><span class="f"><strong>🛠️ සෞඛ්‍ය ප්‍රවර්ධන 5</strong><small>ප්‍ර–හි–ප්‍රජා–නි–සේවා</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ප්‍රතිපත්ති · හිතකර පරිසරය · ප්‍රජා දායකත්වය · පුද්ගල නිපුණතා · සෞඛ්‍ය සේවා</span></span></span></button><button class="flip" data-id="hea-m2"><span class="in"><span class="f"><strong>🧒 ජීවන අවධි වයස්</strong><small>10 · 19 · 39 · 59</small><small>👆 පෙරළන්න</small></span><span class="b"><span>නව යොවුන් 10–19 · තරුණ 20–39 · මැදි 40–59 · වැඩිහිටි 60+. ළමා: පෙර 1–5, පසු 6–10.</span></span></span></button><button class="flip" data-id="hea-m3"><span class="in"><span class="f"><strong>👶 අඩු බර උපත</strong><small>2.5 kg</small><small>👆 පෙරළන්න</small></span><span class="b"><span>උපත් බර 2.5 kg ට අඩු. මාස 6ක් මව්කිරි පමණක්.</span></span></span></button><button class="flip" data-id="hea-m4"><span class="in"><span class="f"><strong>🥗 ආහාර කාණ්ඩ A–F</strong><small>ධා–එ–ප–ප්‍රෝ–කි–තෙ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>A ධාන්‍ය · B එළවළු · C පලතුරු · D ප්‍රෝටීන් · E කිරි · F තෙල්/ඇට</span></span></span></button><button class="flip" data-id="hea-m5"><span class="in"><span class="f"><strong>⚖️ BMI සූත්‍රය</strong><small>බර ÷ උස²</small><small>👆 පෙරළන්න</small></span><span class="b"><span>බර (kg) ÷ උස (m)². උස මීටර්වලින්!</span></span></span></button><button class="flip" data-id="hea-m6"><span class="in"><span class="f"><strong>🎨 BMI වර්ණ</strong><small>තැ–කො–ලා–ත</small><small>👆 පෙරළන්න</small></span><span class="b"><span>&lt;18.5 කෘශ (තැඹිලි) · 18.5–22.9 නිසි (කොළ) · 23–26.9 අධිබර (ලා දම්) · ≥27 ස්ථුල (තද දම්)</span></span></span></button><button class="flip" data-id="hea-m7"><span class="in"><span class="f"><strong>💊 ක්ෂුද්‍ර පෝෂක</strong><small>අයඩීන් – ගෙල ගඩු</small><small>👆 පෙරළන්න</small></span><span class="b"><span>අයඩීන් → ගලගණ්ඩය · යකඩ → රක්තහීනතාව · විටමින් A → රාත්‍රි අන්ධතාව · කැල්සියම් → දත්/අස්ථි</span></span></span></button><button class="flip" data-id="hea-m8"><span class="in"><span class="f"><strong>☕ තේ/කෝපි</strong><small>යකඩ උරා ගැනීම</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ප්‍රධාන වේල් අසල තේ/කෝපි නොබොන්න — යකඩ උරා ගැනීම අඩු වේ.</span></span></span></button><button class="flip" data-id="hea-m9"><span class="in"><span class="f"><strong>🧫 ආහාර නරක් වීම</strong><small>ක්ෂුද්‍ර · සත්ව · පරිසර</small><small>👆 පෙරළන්න</small></span><span class="b"><span>බැක්ටීරියා/පුස් · මීයා/කැරපොත්තා · උෂ්ණත්වය/තෙතමනය/O₂</span></span></span></button><button class="flip" data-id="hea-m10"><span class="in"><span class="f"><strong>🏷️ ආහාර මිලදී ගැනීම</strong><small>SLS + දිනය</small><small>👆 පෙරළන්න</small></span><span class="b"><span>SLS ලාංඡනය · කල් ඉකුත්වන දිනය · සීල් කර ඇති බව</span></span></span></button><button class="flip" data-id="hea-m11"><span class="in"><span class="f"><strong>🦴 සන්ධි 2</strong><small>ගෝල vs අසව්</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ගෝල කුහර — උරහිස/ගත (සෑම දිශාවට) · අසව් — වැලමිට/දණහිස</span></span></span></button><button class="flip" data-id="hea-m12"><span class="in"><span class="f"><strong>🔧 ලීවර 3</strong><small>I ආධාරක · II බර · III බලය</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ඒ ඒ මැදින් — I සීසෝව, II රෝද පුරුක්කුව, III වැලමිටින් අත නැමීම</span></span></span></button><button class="flip" data-id="hea-m13"><span class="in"><span class="f"><strong>⚖️ සමබරතාව</strong><small>පහළ + පළල්</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ගුරුත්ව කේන්ද්‍රය පහළ · ආධාරක පතුල විශාල → සමබරතාව වැඩි</span></span></span></button><button class="flip" data-id="hea-m14"><span class="in"><span class="f"><strong>❤️ යෝග්‍යතා 4+6</strong><small>ස 4 · චා 6</small><small>👆 පෙරළන්න</small></span><span class="b"><span>සෞඛ්‍ය ආශ්‍රිත 4: හෘද-ශ්වසන, පේශි, නම්‍යතාව, සංයුතිය. චාලක 6: සමබරතාව, ජවය, උලැඟිතාව, සමායෝජනය, වේගය, ප්‍රතික්‍රියා වේගය</span></span></span></button><button class="flip" data-id="hea-m15"><span class="in"><span class="f"><strong>🔋 ATP</strong><small>ATP → ADP + P + ශක්තිය</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ශක්තිය නිකුත් වන්නේ ATP බිඳවැටෙන විට.</span></span></span></button><button class="flip" data-id="hea-m16"><span class="in"><span class="f"><strong>🛣️ ශක්ති ක්‍රම 3</strong><small>CP · ලැක්ටික් · ස්වායු</small><small>👆 පෙරළන්න</small></span><span class="b"><span>CP: 100 m, පැනීම්, බර · ලැක්ටික්: 400–800 m · ස්වායු: 1500 m +, මැරතන්</span></span></span></button><button class="flip" data-id="hea-m17"><span class="in"><span class="f"><strong>🔴⚪ තන්තු</strong><small>රතු = දිගු · සුදු = ක්ෂණික</small><small>👆 පෙරළන්න</small></span><span class="b"><span>රතු: සෙමින්, ස්වායු, වෙහෙසට ප්‍රමාද. සුදු: වේගයෙන්, නිර්වායු, වෙහෙසට ඉක්මන්.</span></span></span></button><button class="flip" data-id="hea-m18"><span class="in"><span class="f"><strong>🏃 ඉසව් වර්ග</strong><small>ජවන · පිටිය · ප්‍රයාම</small><small>👆 පෙරළන්න</small></span><span class="b"><span>තිරස් = දුර, තුන් පිම්ම · සිරස් = උස, රිටි · විසි = යගුලිය, කවපෙත්ත, හෙල්ලය, මිටිය</span></span></span></button><button class="flip" data-id="hea-m19"><span class="in"><span class="f"><strong>🏁 ධාවන ආරම්භය</strong><small>කුදු vs හිටි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කෙටි දුර — කුදු ඇරඹුම; 800 m+ — හිටි. False start → ආරම්භකයා නවත්වයි.</span></span></span></button><button class="flip" data-id="hea-m20"><span class="in"><span class="f"><strong>🥇 ජයග්‍රාහකයා</strong><small>කඳ + සිරස් තලය</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කඳ (torso) අවසන් රේඛාවේ ධාවන දිශාවට ළඟම දාරයේ සිරස් තලය ස්පර්ශ කිරීම</span></span></span></button><button class="flip" data-id="hea-m21"><span class="in"><span class="f"><strong>🤝
