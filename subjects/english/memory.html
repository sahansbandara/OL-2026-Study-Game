<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>English — Memory Tricks</title>
<link rel="stylesheet" href="../../assets/game.css">
<style>.flip .in{display:block} .flip .f,.flip .b{display:flex} .deck{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}</style>
</head>
<body data-root="../../" data-subject="english" data-page="memory">
<main class="wrap">
  <div class="page-head">
    <div class="kicker">Level 3</div>
    <h1>🧠 Memory Tricks — 36 cards</h1>
    <p>Look at the front, say the answer in your head, then flip. Every new card gives +2 XP.</p>
    <div class="callout tip"><span class="ic">💡</span><div><p><b>Active recall:</b> trying to remember beats re-reading. Do the deck twice a day.</p></div></div>
  </div>
  <nav class="tabs" id="tabs"></nav>
  <div class="deck"><button class="flip" data-id="eng-m0"><span class="in"><span class="f"><strong>🧱 Tense pattern</strong><small>Perfect</small><small>👆 flip</small></span><span class="b"><span>have/has/had + V3 (has gone, had left)</span></span></span></button><button class="flip" data-id="eng-m1"><span class="in"><span class="f"><strong>🔁 Continuous</strong><small>BE + V-ing</small><small>👆 flip</small></span><span class="b"><span>is/was + V-ing; perfect continuous = have/has/had been + V-ing</span></span></span></button><button class="flip" data-id="eng-m2"><span class="in"><span class="f"><strong>⏳ for vs since</strong><small>Duration vs start</small><small>👆 flip</small></span><span class="b"><span>for = how long (for 2 hours); since = starting point (since 2015)</span></span></span></button><button class="flip" data-id="eng-m3"><span class="in"><span class="f"><strong>🔄 Passive formula</strong><small>BE + V3</small><small>👆 flip</small></span><span class="b"><span>The bridge was built. Keep the tense on the be-word.</span></span></span></button><button class="flip" data-id="eng-m4"><span class="in"><span class="f"><strong>🏗️ Passive continuous</strong><small>is/are/was/were being + V3</small><small>👆 flip</small></span><span class="b"><span>The road is being built.</span></span></span></button><button class="flip" data-id="eng-m5"><span class="in"><span class="f"><strong>✅ Passive perfect</strong><small>has/have/had been + V3</small><small>👆 flip</small></span><span class="b"><span>The app has been designed.</span></span></span></button><button class="flip" data-id="eng-m6"><span class="in"><span class="f"><strong>🚫 No passive</strong><small>Intransitive verbs</small><small>👆 flip</small></span><span class="b"><span>arrive, come, go, happen, complain have no passive</span></span></span></button><button class="flip" data-id="eng-m7"><span class="in"><span class="f"><strong>🔀 Conditional 1</strong><small>If + present, will + V</small><small>👆 flip</small></span><span class="b"><span>If you study, you will pass.</span></span></span></button><button class="flip" data-id="eng-m8"><span class="in"><span class="f"><strong>🔀 Conditional 2</strong><small>If + past, would + V</small><small>👆 flip</small></span><span class="b"><span>If I had a car, I would go.</span></span></span></button><button class="flip" data-id="eng-m9"><span class="in"><span class="f"><strong>🔀 Conditional 3</strong><small>If + had + V3, would have + V3</small><small>👆 flip</small></span><span class="b"><span>If he had practised, he would have won.</span></span></span></button><button class="flip" data-id="eng-m10"><span class="in"><span class="f"><strong>❌ Unless</strong><small>unless = if … not</small><small>👆 flip</small></span><span class="b"><span>Unless you hurry = If you don’t hurry</span></span></span></button><button class="flip" data-id="eng-m11"><span class="in"><span class="f"><strong>🔗 although vs however</strong><small>One sentence vs new sentence</small><small>👆 flip</small></span><span class="b"><span>Although it rained, we went. It rained. However, we went.</span></span></span></button><button class="flip" data-id="eng-m12"><span class="in"><span class="f"><strong>🔗 whenever / while</strong><small>Every time / same time</small><small>👆 flip</small></span><span class="b"><span>Whenever I see her, I smile. I read while I wait.</span></span></span></button><button class="flip" data-id="eng-m13"><span class="in"><span class="f"><strong>🪜 Reported speech</strong><small>One step back</small><small>👆 flip</small></span><span class="b"><span>am→was, will→would, did→had + V3, now→then</span></span></span></button><button class="flip" data-id="eng-m14"><span class="in"><span class="f"><strong>❓ Reported questions</strong><small>Statement order</small><small>👆 flip</small></span><span class="b"><span>He asked where I lived. (no ‘did’, no ‘?’)</span></span></span></button><button class="flip" data-id="eng-m15"><span class="in"><span class="f"><strong>❔ if / whether</strong><small>Yes/No questions</small><small>👆 flip</small></span><span class="b"><span>She asked if I was ready.</span></span></span></button><button class="flip" data-id="eng-m16"><span class="in"><span class="f"><strong>🧐 Make a question</strong><small>Wh- + aux + subject + verb?</small><small>👆 flip</small></span><span class="b"><span>When did he immigrate to Sri Lanka?</span></span></span></button><button class="flip" data-id="eng-m17"><span class="in"><span class="f"><strong>📍 at / in / on</strong><small>Dot, box, line</small><small>👆 flip</small></span><span class="b"><span>at 6, at the gate · in May, in a room · on Friday, on the wall</span></span></span></button><button class="flip" data-id="eng-m18"><span class="in"><span class="f"><strong>📍 for / during</strong><small>Duration / period</small><small>👆 flip</small></span><span class="b"><span>for two hours · during the holidays · the reason for the delay</span></span></span></button><button class="flip" data-id="eng-m19"><span class="in"><span class="f"><strong>👥 each other / one another</strong><small>2 vs more than 2</small><small>👆 flip</small></span><span class="b"><span>The twins helped each other.</span></span></span></button><button class="flip" data-id="eng-m20"><span class="in"><span class="f"><strong>✏️ its vs it’s</strong><small>Belongs vs is</small><small>👆 flip</small></span><span class="b"><span>its tail · it’s raining</span></span></span></button><button class="flip" data-id="eng-m21"><span class="in"><span class="f"><strong>🔤 a / an</strong><small>Sound, not letter</small><small>👆 flip</small></span><span class="b"><span>an hour, a university</span></span></span></button><button class="flip" data-id="eng-m22"><span class="in"><span class="f"><strong>🧬 Word-form clue</strong><small>Position decides</small><small>👆 flip</small></span><span class="b"><span>after ‘the’ = noun · after ‘be’ = adj · modifies verb = adverb</span></span></span></button><button class="flip" data-id="eng-m23"><span class="in"><span class="f"><strong>👂 Homophones</strong><small>two/to/too · wear/where</small><small>👆 flip</small></span><span class="b"><span>right/write · nose/knows · four/for · hear/here</span></span></span></button><button class="flip" data-id="eng-m24"><span class="in"><span class="f"><strong>🖼️ Test 1/13</strong><small>Keywords + text type</small><small>👆 flip</small></span><span class="b"><span>recipe = steps; advert = discount; notice = dates</span></span></span></button><button class="flip" data-id="eng-m25"><span class="in"><span class="f"><strong>📊 Test 5 table</strong><small>Copy exact words</small><small>👆 flip</small></span><span class="b"><span>Read headings first; short phrases from the text</span></span></span></button><button class="flip" data-id="eng-m26"><span class="in"><span class="f"><strong>🧩 Test 11 cloze</strong><small>14 gaps, 1 extra</small><small>👆 flip</small></span><span class="b"><span>Grammar first (preposition, verb, article), cross out words</span></span></span></button><button class="flip" data-id="eng-m27"><span class="in"><span class="f"><strong>📰 Test 15</strong><small>Evidence for every answer</small><small>👆 flip</small></span><span class="b"><span>True/False needs a line; reference = nearest noun before</span></span></span></button><button class="flip" data-id="eng-m28"><span class="in"><span class="f"><strong>📋 Notice (Test 6)</strong><small>Content 2 + Language 3</small><small>👆 flip</small></span><span class="b"><span>40–50 words; every guideline point; date, time, place; name + post</span></span></span></button><button class="flip" data-id="eng-m29"><span class="in"><span class="f"><strong>📝 Paragraph (Test 8)</strong><small>50–60 words</small><small>👆 flip</small></span><span class="b"><span>Topic sentence + 3 points + closing; right tense</span></span></span></button><button class="flip" data-id="eng-m30"><span class="in"><span class="f"><strong>✉️ Letter (Test 14)</strong><small>C3 L3 O2 M2 = 10</small><small>👆 flip</small></span><span class="b"><span>All points in order; format; Yours faithfully/sincerely</span></span></span></button><button class="flip" data-id="eng-m31"><span class="in"><span class="f"><strong>📊 Chart words</strong><small>most / least / more than</small><small>👆 flip</small></span><span class="b"><span>Introduce → highest/lowest → compare → summary</span></span></span></button><button class="flip" data-id="eng-m32"><span class="in"><span class="f"><strong>📰 Test 16</strong><small>C5 L5 O2 M3 = 15</small><small>👆 flip</small></span><span class="b"><span>~200 words; plan; connected paragraphs; proofread</span></span></span></button><button class="flip" data-id="eng-m33"><span class="in"><span class="f"><strong>🎤 Speech</strong><small>Respected principal…</small><small>👆 flip</small></span><span class="b"><span>Greeting → purpose → points → persuasive → thank you</span></span></span></button><button class="flip" data-id="eng-m34"><span class="in"><span class="f"><strong>🧾 Marks map</strong><small>40 + 60 = 100</small><small>👆 flip</small></span><span class="b"><span>Paper I 1 h (T1–8) · Paper II 2 h (T9–16) · Writing 35, Reading 35, Vocab 15, Grammar 15</span></span></span></button><button class="flip" data-id="eng-m35"><span class="in"><span class="f"><strong>🔡 Mechanics</strong><small>Capital . ? ! , ’ “ ”</small><small>👆 flip</small></span><span class="b"><span>Spelling + punctuation + clear handwriting = free marks</span></span></span></button></div>
</main>
