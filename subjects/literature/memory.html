    <h1>🧠 මතක උපක්‍රම — කාඩ්පත් 50</h1>
    <p>කාඩ්පතක ඉදිරිපස බලලා, පිටුපස මොකද කියලා මතක් කරන්න. ඊට පස්සේ පෙරළලා බලන්න. හැම කාඩ්පතකටම +2 XP!</p>
    <div class="callout tip"><span class="ic">💡</span><div><p><b>Active recall:</b> කියවනවට වඩා මතකයෙන් ගන්න උත්සාහ කරන එක හොඳයි. කතුවරයා/ කාලය ගැන සටහන් පෙළපොතින් තහවුරු කරගන්න.</p></div></div>
