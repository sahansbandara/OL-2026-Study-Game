    <h1>🧠 මතක උපක්‍රම — කාඩ්පත් 41</h1>
    <p>කාඩ්පතක ඉදිරිපස කෙටි ක්‍රමය බලලා, පිටුපස මොකද කියලා ඔයාම මතක් කරන්න. ඊට පස්සේ පෙරළලා බලන්න. හැම කාඩ්පතකටම +2 XP!</p>
    <div class="callout tip"><span class="ic">💡</span><div><p><b>Active recall:</b> කියවනවට වඩා “මතකයෙන් ගන්න” උත්සාහ කරන එකයි මොළයට හොඳම. දවසට දෙපාරක් මේ කාඩ්පත් ටික බලන්න.</p></div></div>

  <nav class="tabs" id="tabs"></nav>
  <div class="deck"><button class="flip" data-id="civ-m0"><span class="in"><span class="f"><strong>🌈 බහුසංස්කෘතික හේතු</strong><small>පි-සං-ආ-වෙ-ශ්‍ර-අ-ගෝ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>පිහිටීම, සංක්‍රමණ, ආක්‍රමණ, වෙළඳාම, ශ්‍රමිකයන්, අන්තර් විවාහ, ගෝලීයකරණය.</span></span></span></button><button class="flip" data-id="civ-m1"><span class="in"><span class="f"><strong>👥 ජනවර්ග 7</strong><small>සිං-ශ්‍රී-ඉන්-මුස්-බර්-මැ-වැ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>සිංහල, ශ්‍රී ලංකා දෙමළ, ඉන්දියානු දෙමළ, මුස්ලිම්, බර්ගර්, මැලේ, වැදි.</span></span></span></button><button class="flip" data-id="civ-m2"><span class="in"><span class="f"><strong>🚢 යුරෝපීය ජාතීන්</strong><small>පෘ-ල-ඉං</small><small>👆 පෙරළන්න</small></span><span class="b"><span>පෘතුගීසි, ලන්දේසි, ඉංග්‍රීසි. ඉන්දියානු නොලියන්න!</span></span></span></button><button class="flip" data-id="civ-m3"><span class="in"><span class="f"><strong>🏛️ ප්‍රජාතන්ත්‍රවාදය</strong><small>ජනතා පාලනය</small><small>👆 පෙරළන්න</small></span><span class="b"><span>පරමාධිපත්‍යය ජනතාව සතු. සෘජු (ග්‍රීසිය, ජනමත විචාරණ) vs නියෝජන.</span></span></span></button><button class="flip" data-id="civ-m4"><span class="in"><span class="f"><strong>🚫 ග්‍රීසියෙන් බැහැර</strong><small>කා-ව-වි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කාන්තාවන්, වහලුන්, විදේශිකයන් සෘජු ප්‍රජාතන්ත්‍රවාදයෙන් බැහැර විය.</span></span></span></button><button class="flip" data-id="civ-m5"><span class="in"><span class="f"><strong>🗳️ නිදහස්-සාධාරණ මැතිවරණ</strong><small>කාල-සුදු-නීති-සාම-දූෂ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>නියමිත කාලයට, ඡන්ද/අපේක්ෂක සුදුසුකම්, නීතියට අනුව, සාමකාමී, දූෂණ රහිත.</span></span></span></button><button class="flip" data-id="civ-m6"><span class="in"><span class="f"><strong>🎭 පක්ෂ ක්‍රම</strong><small>ඒක · ද්වි · බහු</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ඒක — චීනය; ද්වි — ඇමරිකාව, බ්‍රිතාන්‍යය; බහු — ශ්‍රී ලංකාව, ඉන්දියාව.</span></span></span></button><button class="flip" data-id="civ-m7"><span class="in"><span class="f"><strong>⚖️ යහපාලනය</strong><small>සහභාගිත්ව · විනිවිද · වගවීම</small><small>👆 පෙරළන්න</small></span><span class="b"><span>මහජන සහභාගිත්වය, නීතියේ ආධිපත්‍යය, විනිවිදභාවය, වගවීම, දූෂණ රහිත, අධිකරණ ස්වාධීනත්වය, මාධ්‍ය නිදහස.</span></span></span></button><button class="flip" data-id="civ-m8"><span class="in"><span class="f"><strong>📺 මාධ්‍ය කාර්ය</strong><small>සත්‍ය · අපක්ෂපාත · අනාවරණ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>සත්‍ය තොරතුරු, ජනතා දුක්ගැනවිලි පාලකයන්ට, දූෂණ අනාවරණය, නිවැරදි ජනමතය.</span></span></span></button><button class="flip" data-id="civ-m9"><span class="in"><span class="f"><strong>🧱 රාජ්‍යයේ ලක්ෂණ</strong><small>භූ-ජන-ආණ්-ස්වා</small><small>👆 පෙරළන්න</small></span><span class="b"><span>භූමිය, ජනගහනය, ආණ්ඩුව, ස්වාධිපත්‍ය බලය.</span></span></span></button><button class="flip" data-id="civ-m10"><span class="in"><span class="f"><strong>🏛️ ආණ්ඩුවේ අංග</strong><small>වි-ව්‍ය-අධි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>විධායකය, ව්‍යවස්ථාදායකය, අධිකරණය.</span></span></span></button><button class="flip" data-id="civ-m11"><span class="in"><span class="f"><strong>⚖️ ඒකීය vs සන්ධීය</strong><small>බලය කොහේද?</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ඒකීය — මධ්‍යම ආණ්ඩුව (ශ්‍රී ලංකාව, ජපානය, ප්‍රංශය); සන්ධීය — ව්‍යවස්ථාවෙන් බෙදූ (ඇමරිකාව, ඉන්දියාව, ස්විට්සර්ලන්තය, ඕස්ට්‍රේලියාව, කැනඩාව).</span></span></span></button><button class="flip" data-id="civ-m12"><span class="in"><span class="f"><strong>🏢 13 වන සංශෝධන ලැයිස්තු</strong><small>I පළාත් · II සංවෘත · III සමගාමී</small><small>👆 පෙරළන්න</small></span><span class="b"><span>පළාත් සභා ලැයිස්තුව, සංවෘත (මධ්‍යම) ලැයිස්තුව, සමගාමී (පොදු) ලැයිස්තුව.</span></span></span></button><button class="flip" data-id="civ-m13"><span class="in"><span class="f"><strong>🏘️ පළාත් පාලන</strong><small>මහ නගර · නගර · ප්‍රාදේශීය</small><small>👆 පෙරළන්න</small></span><span class="b"><span>මාර්ග, මහජන සෞඛ්‍ය, ජල-විදුලි, කුණු ඉවත් කිරීම, පුස්තකාල, ක්‍රීඩාංගණ.</span></span></span></button><button class="flip" data-id="civ-m14"><span class="in"><span class="f"><strong>📜 ප්‍රතිසංස්කරණ</strong><small>කෝ-කෲ-මැ-ඩො-සෝ-72-78</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කෝල්බෲක් 1833, කෲවී-මැකලම්, මැනිං 1924, ඩොනමෝර් 1931 (සර්වජන ඡන්දය), සෝල්බරි 1947, 1972 ජනරජ, 1978 විධායක ජනාධිපති.</span></span></span></button><button class="flip" data-id="civ-m15"><span class="in"><span class="f"><strong>👑 සෝල්බරි</strong><small>කැබිනට් · ද්විමණ්ඩල</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කැබිනට්, සෙනෙට්+නියෝජිත මන්ත්‍රී මණ්ඩලය, අග්‍රාණ්ඩුකාර, ප්‍රිවි කවුන්සිලය, සේවා කොමිෂන්, සුළු ජාතික අයිතිවාසිකම්.</span></span></span></button><button class="flip" data-id="civ-m16"><span class="in"><span class="f"><strong>📅 අයිතිවාසිකම් ඓතිහාසික</strong><small>1215-1689-1776-1789-1917</small><small>👆 පෙරළන්න</small></span><span class="b"><span>මැග්නා කාර්ටා, අයිතිවාසිකම් පනත, ඇමරිකානු නිදහස් ප්‍රකාශනය, ප්‍රංශ ප්‍රකාශනය, රුසියානු විප්ලවය.</span></span></span></button><button class="flip" data-id="civ-m17"><span class="in"><span class="f"><strong>👶 CRC මූලධර්ම 4</strong><small>උප-සහ-වෙන-පැවැ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>උපරිම යහපත, සහභාගිත්වය, වෙනස්කොට නොසැලකීම, පැවැත්ම හා සංවර්ධනය.</span></span></span></button><button class="flip" data-id="civ-m18"><span class="in"><span class="f"><strong>🌐 UN ලියවිලි</strong><small>UDHR · ICCPR · ICESCR · CEDAW · CRC</small><small>👆 පෙරළන්න</small></span><span class="b"><span>UDHR 1948; ICCPR සිවිල්-දේශපාලන; ICESCR ආර්ථික-සමාජ-සංස්කෘතික; CEDAW කාන්තා; CRC ළමා.</span></span></span></button><button class="flip" data-id="civ-m19"><span class="in"><span class="f"><strong>🤲 පුරවැසි යුතුකම්</strong><small>නීතිමය vs සදාචාරාත්මක</small><small>👆 පෙරළන්න</small></span><span class="b"><span>නීතිමය: බදු ගෙවීම, නීතියට ගරු, පොදු දේපළ රැකීම. සදාචාරාත්මක: සංවර්ධනයට දායක වීම, අන් ආගමට ගරු.</span></span></span></button><button class="flip" data-id="civ-m20"><span class="in"><span class="f"><strong>🏛️ අධිකරණ ධුරාවලිය</strong><small>ශ්‍රේ-අභි-මහා-දිසා-මහේ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ශ්‍රේෂ්ඨාධිකරණය → අභියාචනාධිකරණය → මහාධිකරණය → දිසා → මහේස්ත්‍රාත්.</span></span></span></button><button class="flip" data-id="civ-m21"><span class="in"><span class="f"><strong>📖 විශේෂ නීති</strong><small>උ-තේ-මු</small><small>👆 පෙරළන්න</small></span><span class="b"><span>උඩරට, තේසවලාමෙයි, මුස්ලිම් නීතිය.</span></span></span></button><button class="flip" data-id="civ-m22"><span class="in"><span class="f"><strong>👨‍⚖️ නීතිපති vs අගවිනිසුරු</strong><small>සහාය vs රීති</small><small>👆 පෙරළන්න</small></span><span class="b"><span>නීතිපතිට සහාය — සොලිස්ටර් ජනරාල්; රීති සම්පාදනය — අගවිනිසුරු.</span></span></span></button><button class="flip" data-id="civ-m23"><span class="in"><span class="f"><strong>⚖️ ජනාධිපතිවරණ / පාර්ලිමේන්තු පෙත්සම්</strong><small>ශ්‍රේෂ්ඨ / අභියාචනා</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ජනාධිපතිවරණ — ශ්‍රේෂ්ඨාධිකරණය; පාර්ලිමේන්තු මැතිවරණ — අභියාචනාධිකරණය; මිනීමැරුම් — මහාධිකරණය; දික්කසාද — දිසා.</span></span></span></button><button class="flip" data-id="civ-m24"><span class="in"><span class="f"><strong>🔥 ගැටුම් නිරාකරණ ක්‍රම 6</strong><small>සා-කේ-මැ-සම-බේ-වි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>සාකච්ඡා, කේවල්/සහමන්ත්‍රණය, මැදිහත්කරණය, සමථකරණය, බේරුම් කිරීම, විනිසීම.</span></span></span></button><button class="flip" data-id="civ-m25"><span class="in"><span class="f"><strong>🔺 ගැල්ටුන් ත්‍රිකෝණය</strong><small>සන්දර්භය · ආකල්ප · චර්යාව</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ගැටුමක මුල් සාධක 3 — ජොහාන් ගැල්ටුන්.</span></span></span></button><button class="flip" data-id="civ-m26"><span class="in"><span class="f"><strong>🧑‍🤝‍🧑 බේරුම් vs මැදිහත්</strong><small>ජය-ජය vs එක් අයෙක් දිනයි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>මැදිහත්කරණය — ජය-ජය, තීරණය පාර්ශ්වයන්ගේ. බේරුම් කිරීම — බේරුම්කරු තීරණය, එක් පාර්ශ්වයක් දිනයි.</span></span></span></button><button class="flip" data-id="civ-m27"><span class="in"><span class="f"><strong>🧘 ගැටුම් විසඳීමේ ගුණාංග</strong><small>ආ-ක-ඉ-මු-සං...</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ආත්මාවබෝධය, කරුණාව-මෛත්‍රිය, ඉවසීම, මුදිතාව, සන්නිවේදනය, සංවේදී බව, අවිහිංසාව, සාධාරණත්වය.</span></span></span></button><button class="flip" data-id="civ-m28"><span class="in"><span class="f"><strong>🌍 ගැටුම් පාර්ශ්ව 4</strong><small>තුළ · අතර · කණ්ඩායම් · රටවල්</small><small>👆 පෙරළන්න</small></span><span class="b"><span>පුද්ගලයා තුළ, පුද්ගලයන් අතර, ජන කණ්ඩායම් අතර, රටවල් අතර.</span></span></span></button><button class="flip" data-id="civ-m29"><span class="in"><span class="f"><strong>🌳 පරිසර සංරචක</strong><small>භෞතික · ජෛව · සමාජ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ශිලා/ජල/වායු ගෝල; ශාක-සත්ත්ව; සමාජ (අභෞතික).</span></span></span></button><button class="flip" data-id="civ-m30"><span class="in"><span class="f"><strong>🌱 පරිසර සේවා</strong><small>ජී-ආ-අ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>ජීව උපකාරක, ආර්ථික උපකාරක (අමුද්‍රව්‍ය + ශක්තිය), අපද්‍රව්‍ය අවශෝෂණ.</span></span></span></button><button class="flip" data-id="civ-m31"><span class="in"><span class="f"><strong>🌡️ දේශගුණ වෙනස</strong><small>සුනාමි නොවේ!</small><small>👆 පෙරළන්න</small></span><span class="b"><span>උෂ්ණත්වය ඉහළ, සාගර ජල මට්ටම ඉහළ, එල්නිනෝ, වර්ෂා වෙනස. සුනාමි = ස්වභාවික හානියක්.</span></span></span></button><button class="flip" data-id="civ-m32"><span class="in"><span class="f"><strong>♻️ තිරසර සංවර්ධනය</strong><small>අනාගත පරම්පරාවට බාධා නොවී</small><small>👆 පෙරළන්න</small></span><span class="b"><span>වර්තමාන අවශ්‍යතා සපුරන, අනාගත පරම්පරාවේ හැකියාවට හානි නොකරන සංවර්ධනය (බ්‍රන්ඩ්ට්ලන්ඩ්).</span></span></span></button><button class="flip" data-id="civ-m33"><span class="in"><span class="f"><strong>❓ මූලික ආර්ථික ප්‍රශ්න</strong><small>කුමක් · කෙසේ · කවුරුන්</small><small>👆 පෙරළන්න</small></span><span clas
