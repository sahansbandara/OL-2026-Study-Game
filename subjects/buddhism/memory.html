    <h1>🧠 මතක උපක්‍රම — කාඩ්පත් 30</h1>
    <p>කාඩ්පතක ඉදිරිපස කෙටි ක්‍රමය බලලා, පිටුපස මොකද කියලා ඔයාම මතක් කරන්න. ඊට පස්සේ පෙරළලා බලන්න. හැම කාඩ්පතකටම +2 XP!</p>
    <div class="callout tip"><span class="ic">💡</span><div><p><b>Active recall:</b> කියවනවට වඩා “මතකයෙන් ගන්න” උත්සාහ කරන එකයි මොළයට හොඳම. දවසට දෙපාරක් මේ කාඩ්පත් ටික බලන්න.</p></div></div>

  <div class="deck"><button class="flip" data-id="bud-m0"><span class="in"><span class="f"><strong>🔢 තෙරුවන් ගුණ</strong><small>9–6–9 = 24</small><small>👆 පෙරළන්න</small></span><span class="b"><span>බුදු ගුණ 9 · දහම් ගුණ 6 · සඟ ගුණ 9.<br>දහම් ගුණ: <b>ස්වා–සන්–අකා–ඒහි–ඕප–පච්</b></span></span></span></button><button class="flip" data-id="bud-m1"><span class="in"><span class="f"><strong>🌳 සත්සතිය</strong><small>බෝ–අනි–රත–ඝර–අජ–මුච–රාජ</small><small>👆 පෙරළන්න</small></span><span class="b"><span>බෝධි පල්ලංක · අනිමිස ලෝචන · රතන චංක්‍රමණ · රතනඝර · අජපාල · මුචලින්ද · රාජායතන</span></span></span></button><button class="flip" data-id="bud-m2"><span class="in"><span class="f"><strong>☸️ අන්ත දෙක</strong><small>කාම vs අත්ත</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කාමසුඛල්ලිකානුයෝගය (සැපයේ ඇලීම) ❌ · අත්තකිලමථානුයෝගය (දුක් දීම) ❌ → මධ්‍යම ප්‍රතිපදාව ✅ (වීණා උපමාව)</span></span></span></button><button class="flip" data-id="bud-m3"><span class="in"><span class="f"><strong>🧘 චරිත 6</strong><small>රා–ද්වේ–මෝ–ශ්‍ර–බු–වි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>රාග→අසුභ · ද්වේෂ→මෛත්‍රී · මෝහ/විතර්ක→ආනාපානසති · ශ්‍රද්ධා→බුද්ධානුස්සති · බුද්ධි→මරණානුස්සති</span></span></span></button><button class="flip" data-id="bud-m4"><span class="in"><span class="f"><strong>🚫 නීවරණ 5</strong><small>කා–ව්‍යා–ථී–උද්–විචි</small><small>👆 පෙරළන්න</small></span><span class="b"><span>කාමච්ඡන්ද · ව්‍යාපාද · ථීනමිද්ධ · උද්ධච්ච කුක්කුච්ච · විචිකිච්ඡා (වතුර බඳුන උපමාව)</span></span></span></button><button class="flip" data-id="bud-m5"><span class="in"><span class="f"><strong>🌟 දස පාරමිතා</strong><small>දානං සීලං ච නෙක්ඛම්මං…</small><small>👆 පෙරළන්න</small></span><span class="b"><span>දා–සී–නෙ–ප්‍ර–වී | ඛ–ස–අ–මෙ–උ<br>⚠️ රාජ ධර්ම: දානං සීලං <b>පරිච්චාගං</b></span></span></span></button><button class="flip" data-id="bud-m6"><span class="in"><span class="f"><strong>👑 දස රාජ ධර්ම</strong><small>දානං සීලං පරිච්චාගං…</small><small>👆 පෙරළන්න</small></span><span class="b"><span>දාන
